[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snakeoil-synth"
version = "0.2.0"
description = "SnakeOil Synth, a polyphonic MIDI synthesizer with a Qt GUI, written in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
snakeoil-synth = "run:main"
snakeoil-synth-render = "render_demo:main"

[tool.setuptools]
py-modules = ["run", "render_demo"]
packages = ["midi_synth", "midi_synth.gui"]
